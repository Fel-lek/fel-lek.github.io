<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me - Fel-lek</title>

    <link rel="stylesheet" href="../theme.css">
    <link rel="stylesheet" href="contact.css">
</head>

<body>

    <div id="taskbar"></div>

    <main id="contact-page">

        <section class="contact-card">

            <div class="contact-header">
                <span class="contact-type">GET IN TOUCH</span>

                <h1>Contact Me</h1>

                <p>
                    If you'd like to get in touch, you can reach me through
                    any of the following methods.
                </p>
            </div>

            <div class="contact-options">

                <a class="contact-option" href="mailto:your.email@example.com">

                    <div class="contact-icon">
                        @
                    </div>

                    <div class="contact-content">
                        <h2>Email</h2>
                        <p>dobrzyckip0@gmail.com</p>
                    </div>

                    <span class="contact-arrow">→</span>

                </a>

                <a class="contact-option" href="https://github.com/fel-lek" target="_blank">

                    <div class="contact-icon">
                        GH
                    </div>

                    <div class="contact-content">
                        <h2>GitHub</h2>
                        <p>github.com/fel-lek</p>
                    </div>

                    <span class="contact-arrow">→</span>

                </a>

                <a class="contact-option" href="https://www.linkedin.com/in/piotr-dobrzycki/" target="_blank">

                    <div class="contact-icon">
                        In
                    </div>

                    <div class="contact-content">
                        <h2>LinkedIn</h2>
                        <p>Connect with me professionally</p>
                    </div>

                    <span class="contact-arrow">→</span>

                </a>

            </div>

        </section>

    </main>

    <script src="../taskbar/taskbar.js"></script>

</body>

</html>
